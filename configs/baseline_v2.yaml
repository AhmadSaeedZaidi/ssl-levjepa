seed: 42
compile: false
ema: null
model: {patch_size: 16, residual_dim: 192, depth: 12, num_heads: 3, attention_window: 16}
masking: {keep_global: 0.10, keep_local: 0.10, iid: true}
dataset_kind_expected: SUMATRA_NATIVE_AI_VS_AI_IDEALIZED_PHYSICS_NOT_REAL_RGB
dataset:
  path: outputs/datasets/sumatra_baseline_v2/train/train.lance
  episodes_path: outputs/datasets/sumatra_baseline_v2/train/train.episodes.npz
  column: frame
validation_dataset:
  path: outputs/datasets/sumatra_baseline_v2/validation/train.lance
  episodes_path: outputs/datasets/sumatra_baseline_v2/validation/train.episodes.npz
  column: frame
validation_every_n_steps: 250
views: {num_local: 4, global_size: 224, local_size: 96}
data: {batch_size: 64, probs: {16: 1.0}, batches_per_epoch: 100, num_workers: 4, height: 256, width: 256, persistent_workers: true}
holdout: null
schedule_total_steps: 3000
scheduler: {type: WSD, peak_step: 300, start_factor: 0.25, decay_epochs: 10}
trainer:
  max_epochs: -1
  max_steps: 3000
  max_time: '00:02:00:00'
  precision: bf16-mixed
  enable_progress_bar: false
  num_sanity_val_steps: 0
  log_every_n_steps: 10
  check_val_every_n_epoch: null
checkpoint: {every_n_train_steps: 1000, save_last: true, save_top_k: 2, monitor: step, mode: max}
wandb: {mode: disabled}
