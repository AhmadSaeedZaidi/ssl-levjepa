# Overrides for the pinned upstream v2 recipe; loss and optimizer stay upstream.
seed: 42
compile: false
ema: null
resume: null
model:
  patch_size: 16
  residual_dim: 192
  depth: 12
  num_heads: 3
  attention_window: 16
masking: {keep_global: 0.10, keep_local: 0.10, iid: true}
dataset:
  path: data/toy_ssl/train.lance
  episodes_path: data/toy_ssl/train.episodes.npz
  column: frame
views:
  num_local: 4
  global_size: 224
  local_size: 96
data:
  batch_size: 8
  probs: {16: 1.0}
  batches_per_epoch: 100
  num_workers: 4
  height: 256
  width: 256
  persistent_workers: true
holdout: {videos: 16, every_n_steps: 100}
scheduler: {type: WSD, peak_step: 50, start_factor: 0.25, decay_epochs: 2}
schedule_total_steps: 1200
trainer:
  max_epochs: -1  # absolute max_steps is authoritative across short-stage resumes
  max_steps: 1200
  max_time: '00:08:00:00'
  precision: bf16-mixed
  enable_progress_bar: false
  num_sanity_val_steps: 0
  log_every_n_steps: 10
checkpoint:
  every_n_train_steps: 100
  save_last: true
  save_top_k: 2
  monitor: step
  mode: max
wandb: {mode: disabled}
