[project]
name = "ssl-levjepa"
version = "0.2.0"
description = "SSL simulator video datasets and reproducible baselines with pinned upstream LeVJEPA"
requires-python = ">=3.12,<3.14"
dependencies = [
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "lightning>=2.6.0",
    "stable-pretraining @ git+https://github.com/galilai-group/stable-pretraining.git@3001802f6c8afcfaae99a5a3760edd952508d1e0",
    "einops>=0.8.2",
    "hydra-core>=1.3.2",
    "huggingface-hub>=0.24",
    "omegaconf>=2.3.0",
    "numpy>=2.0",
    "pillow>=12.2.0",
    "pylance>=6.0.0",
    "pyarrow==20.0.0",
    "safetensors>=0.4",
    "timm>=1.0",
    "torchmetrics>=1.0",
    "wandb>=0.19",
    "matplotlib>=3.9.0",
    "scikit-learn>=1.9,<2",
]

[project.optional-dependencies]
simulation = [
    "grpcio-tools>=1.85.1",
]

[project.scripts]
ssl-levjepa = "ssl_levjepa.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ssl_levjepa"]

[tool.hatch.metadata]
allow-direct-references = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
